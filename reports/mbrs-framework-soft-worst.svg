<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">MBRS ICASSP Soft Worst framework</title>
  <desc id="desc">MBRS encoder-decoder forward path with RandomCrop channel and training-only detached soft-tail patch loss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#155e75"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <style>
      .zh{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;fill:#cffafe}.stage{font-size:14px;font-weight:800}.lane{font-size:27px;font-weight:800}.note{font-size:16px;fill:#64748b}.step{font-size:19px;font-weight:800;fill:#0f172a}.body{font-size:15px;fill:#334155}.small{font-size:13px;fill:#475569}.chip{font-size:14px;font-weight:800}.formula{font-size:17px;font-weight:800;fill:#172554}.white{font-size:15px;font-weight:800;fill:#fff}.box{stroke-width:2;rx:18;ry:18;filter:url(#shadow)}.flow{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#blue)}.loss{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#teal);stroke-dasharray:9 6}.loop{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#green);stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1800" height="1180" fill="url(#bg)"/><rect width="1800" height="124" fill="url(#head)"/>
  <g class="zh"><text x="64" y="58" class="title">MBRS / ICASSP：Soft Worst 框架图</text><text x="66" y="94" class="sub">训练期平滑局部尾部约束｜前向推理保持 Encoder → RandomCrop → Decoder</text></g>
  <g class="zh">
    <rect x="56" y="146" width="286" height="40" rx="20" fill="#e2e8f0"/><text x="199" y="172" text-anchor="middle" class="stage" fill="#334155">① Cover + message</text><rect x="374" y="146" width="286" height="40" rx="20" fill="#dbeafe"/><text x="517" y="172" text-anchor="middle" class="stage" fill="#1d4ed8">② Encoder_MP</text><rect x="692" y="146" width="286" height="40" rx="20" fill="#cffafe"/><text x="835" y="172" text-anchor="middle" class="stage" fill="#155e75">③ Crop channel</text><rect x="1010" y="146" width="286" height="40" rx="20" fill="#e0e7ff"/><text x="1153" y="172" text-anchor="middle" class="stage" fill="#4338ca">④ Decoder</text><rect x="1328" y="146" width="416" height="40" rx="20" fill="#dcfce7"/><text x="1536" y="172" text-anchor="middle" class="stage" fill="#166534">⑤ BER / crop robustness</text>
  </g>
  <!-- shared forward path -->
  <rect x="36" y="204" width="1728" height="304" rx="28" fill="#fff" stroke="#a5f3fc" stroke-width="3"/><rect x="36" y="204" width="16" height="304" rx="8" fill="#0891b2"/>
  <g class="zh">
    <rect x="64" y="236" width="286" height="236" class="box" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="270" class="step">输入</text><rect x="88" y="294" width="100" height="100" rx="10" fill="#a5f3fc" stroke="#06b6d4" stroke-width="2"/><path d="M96 376L126 342L148 360L168 335L180 376Z" fill="#0891b2" opacity=".72"/><circle cx="157" cy="319" r="10" fill="#fbbf24"/><text x="138" y="418" text-anchor="middle" class="small">x：128×128 RGB</text><rect x="208" y="294" width="112" height="34" rx="8" fill="#334155"/><text x="264" y="317" text-anchor="middle" class="white">m ∈ {0,1}⁶⁴</text><text x="208" y="357" class="body">64-bit message</text><text x="208" y="383" class="small">每 batch 随机采样</text><rect x="88" y="442" width="232" height="22" rx="8" fill="#e2e8f0"/><text x="204" y="458" text-anchor="middle" class="small">训练输入：x, m</text>
    <rect x="382" y="236" width="286" height="236" class="box" fill="#eff6ff" stroke="#93c5fd"/><text x="406" y="270" class="step">Encoder_MP</text><rect x="406" y="296" width="104" height="38" rx="8" fill="#bfdbfe"/><text x="458" y="320" text-anchor="middle" class="chip" fill="#1e40af">image branch</text><rect x="526" y="296" width="118" height="38" rx="8" fill="#c4b5fd"/><text x="585" y="320" text-anchor="middle" class="chip" fill="#5b21b6">message branch</text><path d="M458 342V363M585 342V363M458 363H585" stroke="#64748b" stroke-width="2" fill="none"/><rect x="474" y="378" width="114" height="38" rx="8" fill="#0891b2"/><text x="531" y="402" text-anchor="middle" class="white">concat + CNN</text><text x="406" y="445" class="body">skip connection with x</text><text x="406" y="466" class="small">输出 encoded image y</text>
    <rect x="700" y="236" width="286" height="236" class="box" fill="#ecfeff" stroke="#67e8f9"/><text x="724" y="270" class="step">训练噪声层</text><rect x="724" y="298" width="238" height="56" rx="11" fill="#cffafe" stroke="#06b6d4"/><text x="843" y="323" text-anchor="middle" class="chip" fill="#155e75">RandomCrop(0.3, 1.0)</text><text x="843" y="344" text-anchor="middle" class="small" fill="#155e75">保留面积 30%–100%</text><text x="724" y="388" class="body">noised image z = Noise(y, x)</text><text x="724" y="414" class="small">评测固定 crop30 / 50 / 70 / 100</text><rect x="724" y="438" width="238" height="26" rx="8" fill="#a5f3fc"/><text x="843" y="456" text-anchor="middle" class="small" fill="#164e63">盲解码输入 z</text>
    <rect x="1018" y="236" width="286" height="236" class="box" fill="#eef2ff" stroke="#a5b4fc"/><text x="1042" y="270" class="step">Decoder</text><text x="1042" y="311" class="body">CNN + downsampling</text><text x="1042" y="338" class="body">只读取 noised image z</text><rect x="1042" y="364" width="238" height="55" rx="11" fill="#c7d2fe"/><text x="1161" y="389" text-anchor="middle" class="chip" fill="#3730a3">m̂ ∈ [0,1]⁶⁴</text><text x="1161" y="409" text-anchor="middle" class="small" fill="#3730a3">decoded message</text><text x="1042" y="454" class="small">输出消息并计算 BER</text>
    <rect x="1332" y="236" width="404" height="236" class="box" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1356" y="270" class="step">消息目标与评测</text><rect x="1356" y="298" width="356" height="44" rx="10" fill="#d1fae5"/><text x="1534" y="326" text-anchor="middle" class="formula">L_msg = MSE(m̂, m)</text><text x="1356" y="372" class="body">message loss weight = 10</text><text x="1356" y="400" class="body">bit accuracy / BER</text><rect x="1356" y="426" width="356" height="32" rx="9" fill="#bbf7d0"/><text x="1534" y="447" text-anchor="middle" class="chip" fill="#166534">共享前向路径</text>
  </g>
  <path d="M350 354H370" class="flow"/><path d="M668 354H688" class="flow"/><path d="M986 354H1006" class="flow"/><path d="M1304 354H1324" class="flow"/>

  <!-- soft training loss -->
  <rect x="36" y="536" width="1728" height="602" rx="28" fill="#fff" stroke="#99f6e4" stroke-width="3"/><rect x="36" y="536" width="16" height="602" rx="8" fill="#0f766e"/>
  <g class="zh"><text x="76" y="580" class="lane" fill="#0f766e">训练旁路：Soft Worst local loss</text><text x="78" y="609" class="note">用连续权重近似 worst-tail；权重 detach，避免额外 attention 梯度路径</text>
    <rect x="64" y="642" width="340" height="408" class="box" fill="#f0fdfa" stroke="#5eead4"/><text x="88" y="678" class="step">① Patch MSE map</text><text x="88" y="706" class="body">eᵢ = MSE(yᵢ, xᵢ)</text><g stroke="#2dd4bf" stroke-width="1.5"><rect x="106" y="732" width="192" height="192" fill="#ccfbf1"/><path d="M130 732V924M154 732V924M178 732V924M202 732V924M226 732V924M250 732V924M274 732V924"/><path d="M106 756H298M106 780H298M106 804H298M106 828H298M106 852H298M106 876H298M106 900H298"/></g><text x="202" y="955" text-anchor="middle" class="chip" fill="#0f766e">controlled patch16：8×8 = 64</text><text x="88" y="992" class="small">non-overlapping patch；有效像素 mask</text><text x="88" y="1018" class="small">历史 default worst 使用 patch32</text>
    <rect x="438" y="642" width="418" height="408" class="box" fill="#f0fdfa" stroke="#14b8a6"/><text x="462" y="678" class="step">② Detached soft weighting</text><text x="462" y="708" class="formula">sᵢ = eᵢ / sg(mean e)</text><text x="462" y="737" class="formula">wᵢ = softmax(sᵢ / T), T = 0.5</text><g><rect x="482" y="764" width="160" height="160" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><g stroke="#99f6e4" stroke-width="1"><path d="M502 764V924M522 764V924M542 764V924M562 764V924M582 764V924M602 764V924M622 764V924"/><path d="M482 784H642M482 804H642M482 824H642M482 844H642M482 864H642M482 884H642M482 904H642"/></g><rect x="482" y="764" width="20" height="20" fill="#0f766e"/><rect x="502" y="764" width="20" height="20" fill="#0f766e"/><rect x="522" y="784" width="20" height="20" fill="#14b8a6"/><rect x="542" y="804" width="20" height="20" fill="#2dd4bf"/><rect x="562" y="824" width="20" height="20" fill="#5eead4"/><rect x="582" y="844" width="20" height="20" fill="#99f6e4"/><rect x="602" y="864" width="20" height="20" fill="#ccfbf1"/></g><rect x="674" y="764" width="154" height="52" rx="9" fill="#99f6e4"/><text x="751" y="786" text-anchor="middle" class="chip" fill="#115e59">all 64</text><text x="751" y="805" text-anchor="middle" class="small" fill="#115e59">wᵢ &gt; 0</text><rect x="674" y="834" width="154" height="52" rx="9" fill="#ccfbf1"/><text x="751" y="856" text-anchor="middle" class="chip" fill="#115e59">detach = true</text><text x="751" y="875" text-anchor="middle" class="small" fill="#115e59">smooth positive grad</text><text x="462" y="958" class="body">L_soft = weighted mean(wᵢ · eᵢ)</text><text x="462" y="990" class="small">effective patches ≈ 52 / 64（随 batch 改变）</text><rect x="462" y="1014" width="366" height="28" rx="8" fill="#ccfbf1"/><text x="645" y="1033" text-anchor="middle" class="small" fill="#115e59">连续权重 → 减少 top-k 抖动</text>
    <rect x="890" y="642" width="400" height="408" class="box" fill="#fff" stroke="#14b8a6"/><text x="914" y="678" class="step">③ Combined objective</text><rect x="914" y="712" width="352" height="50" rx="10" fill="#d1fae5"/><text x="1090" y="743" text-anchor="middle" class="formula">10 · L_msg</text><text x="1090" y="788" text-anchor="middle" class="chip" fill="#64748b">+</text><rect x="914" y="808" width="352" height="50" rx="10" fill="#dbeafe"/><text x="1090" y="839" text-anchor="middle" class="formula">0.5 · L_global</text><text x="1090" y="884" text-anchor="middle" class="chip" fill="#64748b">+</text><rect x="914" y="904" width="352" height="50" rx="10" fill="#99f6e4"/><text x="1090" y="935" text-anchor="middle" class="formula">0.5 · L_soft</text><rect x="914" y="978" width="352" height="44" rx="10" fill="#0f766e"/><text x="1090" y="1006" text-anchor="middle" class="white">L_total → backprop</text>
    <rect x="1324" y="642" width="412" height="408" class="box" fill="#f0fdfa" stroke="#99f6e4"/><text x="1348" y="678" class="step">④ Controlled continuation</text><rect x="1348" y="712" width="364" height="60" rx="10" fill="#ccfbf1"/><text x="1530" y="738" text-anchor="middle" class="chip" fill="#115e59">source：crop-trained Global epoch 100</text><text x="1530" y="759" text-anchor="middle" class="small" fill="#115e59">same model + Adam state</text><text x="1348" y="806" class="body">single GPU · deterministic</text><text x="1348" y="834" class="body">lr = 1e−4 · 20 epochs</text><text x="1348" y="862" class="body">batch size = 16</text><rect x="1348" y="898" width="364" height="54" rx="10" fill="#d1fae5"/><text x="1530" y="931" text-anchor="middle" class="chip" fill="#166534">PSNR / Worst PSNR / BER</text><text x="1348" y="986" class="small">目的：比较 soft tail 与 hard top-k</text><text x="1348" y="1014" class="small">不改变 Encoder–Noise–Decoder</text></g>
  <path d="M206 508V626" class="loss"/><path d="M525 508V626" class="loss"/><path d="M856 846H878" class="loss"/><path d="M1290 846H1312" class="loss"/><path d="M1100 1050C1000 1120 360 1120 210 1055" class="loop"/>
  <g class="zh"><text x="900" y="1158" text-anchor="middle" class="small" fill="#64748b">蓝色实线：前向数据流｜青色虚线：训练期 loss 旁路｜绿色虚线：反向更新 Encoder / Decoder</text></g>
</svg>
