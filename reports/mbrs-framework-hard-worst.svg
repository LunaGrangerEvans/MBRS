<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">MBRS ICASSP Hard Worst framework</title>
  <desc id="desc">MBRS encoder-decoder forward path with RandomCrop channel and training-only hard top-k worst-patch loss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <style>
      .zh{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;fill:#c7d2fe}.stage{font-size:14px;font-weight:800}.lane{font-size:27px;font-weight:800}.note{font-size:16px;fill:#64748b}.step{font-size:19px;font-weight:800;fill:#0f172a}.body{font-size:15px;fill:#334155}.small{font-size:13px;fill:#475569}.chip{font-size:14px;font-weight:800}.formula{font-size:17px;font-weight:800;fill:#172554}.white{font-size:15px;font-weight:800;fill:#fff}.box{stroke-width:2;rx:18;ry:18;filter:url(#shadow)}.flow{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#blue)}.loss{fill:none;stroke:#ea580c;stroke-width:4;marker-end:url(#orange);stroke-dasharray:9 6}.loop{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#green);stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1800" height="1180" fill="url(#bg)"/><rect width="1800" height="124" fill="url(#head)"/>
  <g class="zh"><text x="64" y="58" class="title">MBRS / ICASSP：Hard Worst 框架图</text><text x="66" y="94" class="sub">训练期局部尾部失真约束｜前向推理保持 Encoder → RandomCrop → Decoder</text></g>
  <g class="zh">
    <rect x="56" y="146" width="286" height="40" rx="20" fill="#e2e8f0"/><text x="199" y="172" text-anchor="middle" class="stage" fill="#334155">① Cover + message</text>
    <rect x="374" y="146" width="286" height="40" rx="20" fill="#dbeafe"/><text x="517" y="172" text-anchor="middle" class="stage" fill="#1d4ed8">② Encoder_MP</text>
    <rect x="692" y="146" width="286" height="40" rx="20" fill="#fef3c7"/><text x="835" y="172" text-anchor="middle" class="stage" fill="#92400e">③ Crop channel</text>
    <rect x="1010" y="146" width="286" height="40" rx="20" fill="#e0e7ff"/><text x="1153" y="172" text-anchor="middle" class="stage" fill="#4338ca">④ Decoder</text>
    <rect x="1328" y="146" width="416" height="40" rx="20" fill="#dcfce7"/><text x="1536" y="172" text-anchor="middle" class="stage" fill="#166534">⑤ BER / crop robustness</text>
  </g>

  <!-- shared forward path -->
  <rect x="36" y="204" width="1728" height="304" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="3"/><rect x="36" y="204" width="16" height="304" rx="8" fill="#2563eb"/>
  <g class="zh">
    <rect x="64" y="236" width="286" height="236" class="box" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="270" class="step">输入</text>
    <rect x="88" y="294" width="100" height="100" rx="10" fill="#c7d2fe" stroke="#818cf8" stroke-width="2"/><path d="M96 376L126 342L148 360L168 335L180 376Z" fill="#6366f1" opacity=".72"/><circle cx="157" cy="319" r="10" fill="#fbbf24"/><text x="138" y="418" text-anchor="middle" class="small">x：128×128 RGB</text>
    <rect x="208" y="294" width="112" height="34" rx="8" fill="#334155"/><text x="264" y="317" text-anchor="middle" class="white">m ∈ {0,1}⁶⁴</text><text x="208" y="357" class="body">64-bit message</text><text x="208" y="383" class="small">每 batch 随机采样</text><rect x="88" y="442" width="232" height="22" rx="8" fill="#e2e8f0"/><text x="204" y="458" text-anchor="middle" class="small">训练输入：x, m</text>

    <rect x="382" y="236" width="286" height="236" class="box" fill="#eff6ff" stroke="#93c5fd"/><text x="406" y="270" class="step">Encoder_MP</text><rect x="406" y="296" width="104" height="38" rx="8" fill="#bfdbfe"/><text x="458" y="320" text-anchor="middle" class="chip" fill="#1e40af">image branch</text><rect x="526" y="296" width="118" height="38" rx="8" fill="#c4b5fd"/><text x="585" y="320" text-anchor="middle" class="chip" fill="#5b21b6">message branch</text><path d="M458 342V363M585 342V363M458 363H585" stroke="#64748b" stroke-width="2" fill="none"/><rect x="474" y="378" width="114" height="38" rx="8" fill="#2563eb"/><text x="531" y="402" text-anchor="middle" class="white">concat + CNN</text><text x="406" y="445" class="body">skip connection with x</text><text x="406" y="466" class="small">输出 encoded image y</text>

    <rect x="700" y="236" width="286" height="236" class="box" fill="#fffbeb" stroke="#fcd34d"/><text x="724" y="270" class="step">训练噪声层</text><rect x="724" y="298" width="238" height="56" rx="11" fill="#fef3c7" stroke="#f59e0b"/><text x="843" y="323" text-anchor="middle" class="chip" fill="#92400e">RandomCrop(0.3, 1.0)</text><text x="843" y="344" text-anchor="middle" class="small" fill="#92400e">保留面积 30%–100%</text><text x="724" y="388" class="body">noised image z = Noise(y, x)</text><text x="724" y="414" class="small">评测固定 crop30 / 50 / 70 / 100</text><rect x="724" y="438" width="238" height="26" rx="8" fill="#fde68a"/><text x="843" y="456" text-anchor="middle" class="small" fill="#78350f">盲解码输入 z</text>

    <rect x="1018" y="236" width="286" height="236" class="box" fill="#eef2ff" stroke="#a5b4fc"/><text x="1042" y="270" class="step">Decoder</text><text x="1042" y="311" class="body">CNN + downsampling</text><text x="1042" y="338" class="body">只读取 noised image z</text><rect x="1042" y="364" width="238" height="55" rx="11" fill="#c7d2fe"/><text x="1161" y="389" text-anchor="middle" class="chip" fill="#3730a3">m̂ ∈ [0,1]⁶⁴</text><text x="1161" y="409" text-anchor="middle" class="small" fill="#3730a3">decoded message</text><text x="1042" y="454" class="small">输出消息并计算 BER</text>

    <rect x="1332" y="236" width="404" height="236" class="box" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1356" y="270" class="step">消息目标与评测</text><rect x="1356" y="298" width="356" height="44" rx="10" fill="#d1fae5"/><text x="1534" y="326" text-anchor="middle" class="formula">L_msg = MSE(m̂, m)</text><text x="1356" y="372" class="body">message loss weight = 10</text><text x="1356" y="400" class="body">bit accuracy / BER</text><rect x="1356" y="426" width="356" height="32" rx="9" fill="#bbf7d0"/><text x="1534" y="447" text-anchor="middle" class="chip" fill="#166534">共享前向路径</text>
  </g>
  <path d="M350 354H370" class="flow"/><path d="M668 354H688" class="flow"/><path d="M986 354H1006" class="flow"/><path d="M1304 354H1324" class="flow"/>

  <!-- hard training loss -->
  <rect x="36" y="536" width="1728" height="602" rx="28" fill="#fff" stroke="#fed7aa" stroke-width="3"/><rect x="36" y="536" width="16" height="602" rx="8" fill="#ea580c"/>
  <g class="zh"><text x="76" y="580" class="lane" fill="#c2410c">训练旁路：Hard Worst local loss</text><text x="78" y="609" class="note">只在训练期比较 clean encoded image y 与 cover x；局部项用于反向更新，不是推理模块</text>
    <rect x="64" y="642" width="340" height="408" class="box" fill="#fff7ed" stroke="#fdba74"/><text x="88" y="678" class="step">① Patch MSE map</text><text x="88" y="706" class="body">eᵢ = MSE(yᵢ, xᵢ)</text><g stroke="#fb923c" stroke-width="1.5"><rect x="106" y="732" width="192" height="192" fill="#ffedd5"/><path d="M130 732V924M154 732V924M178 732V924M202 732V924M226 732V924M250 732V924M274 732V924"/><path d="M106 756H298M106 780H298M106 804H298M106 828H298M106 852H298M106 876H298M106 900H298"/></g><text x="202" y="955" text-anchor="middle" class="chip" fill="#c2410c">controlled patch16：8×8 = 64</text><text x="88" y="992" class="small">non-overlapping patch；有效像素 mask</text><text x="88" y="1018" class="small">历史 default worst 使用 patch32</text>
    <rect x="438" y="642" width="418" height="408" class="box" fill="#fff7ed" stroke="#fb923c"/><text x="462" y="678" class="step">② Hard top-k selector</text><text x="462" y="708" class="formula">k = ceil(64 × 25%) = 16</text><g><rect x="482" y="734" width="160" height="160" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><g stroke="#fdba74" stroke-width="1"><path d="M502 734V894M522 734V894M542 734V894M562 734V894M582 734V894M602 734V894M622 734V894"/><path d="M482 754H642M482 774H642M482 794H642M482 814H642M482 834H642M482 854H642M482 874H642"/></g><g fill="#ea580c"><rect x="482" y="734" width="20" height="20"/><rect x="502" y="734" width="20" height="20"/><rect x="522" y="734" width="20" height="20"/><rect x="542" y="734" width="20" height="20"/><rect x="482" y="754" width="20" height="20"/><rect x="502" y="754" width="20" height="20"/><rect x="522" y="754" width="20" height="20"/><rect x="542" y="754" width="20" height="20"/><rect x="482" y="774" width="20" height="20"/><rect x="502" y="774" width="20" height="20"/><rect x="522" y="774" width="20" height="20"/><rect x="542" y="774" width="20" height="20"/><rect x="482" y="794" width="20" height="20"/><rect x="502" y="794" width="20" height="20"/><rect x="522" y="794" width="20" height="20"/><rect x="542" y="794" width="20" height="20"/></g></g><rect x="674" y="734" width="154" height="52" rx="9" fill="#fed7aa"/><text x="751" y="756" text-anchor="middle" class="chip" fill="#9a3412">selected</text><text x="751" y="775" text-anchor="middle" class="small" fill="#9a3412">16 / 64</text><rect x="674" y="804" width="154" height="52" rx="9" fill="#f1f5f9"/><text x="751" y="826" text-anchor="middle" class="chip" fill="#64748b">not selected</text><text x="751" y="845" text-anchor="middle" class="small" fill="#64748b">48 / 64</text><text x="462" y="934" class="body">L_hard = mean(eᵢ | i ∈ top-k)</text><text x="462" y="967" class="small">未选 patch：local gradient = 0</text><text x="462" y="994" class="small">global MSE 仍作用于整张图像</text><rect x="462" y="1014" width="366" height="28" rx="8" fill="#fee2e2"/><text x="645" y="1033" text-anchor="middle" class="small" fill="#991b1b">top-k 边界切换 → 梯度目标不连续</text>
    <rect x="890" y="642" width="400" height="408" class="box" fill="#fff" stroke="#f59e0b"/><text x="914" y="678" class="step">③ Combined objective</text><rect x="914" y="712" width="352" height="50" rx="10" fill="#d1fae5"/><text x="1090" y="743" text-anchor="middle" class="formula">10 · L_msg</text><text x="1090" y="788" text-anchor="middle" class="chip" fill="#64748b">+</text><rect x="914" y="808" width="352" height="50" rx="10" fill="#dbeafe"/><text x="1090" y="839" text-anchor="middle" class="formula">0.5 · L_global</text><text x="1090" y="884" text-anchor="middle" class="chip" fill="#64748b">+</text><rect x="914" y="904" width="352" height="50" rx="10" fill="#fed7aa"/><text x="1090" y="935" text-anchor="middle" class="formula">0.5 · L_hard</text><rect x="914" y="978" width="352" height="44" rx="10" fill="#ea580c"/><text x="1090" y="1006" text-anchor="middle" class="white">L_total → backprop</text>
    <rect x="1324" y="642" width="412" height="408" class="box" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1348" y="678" class="step">④ Controlled continuation</text><rect x="1348" y="712" width="364" height="60" rx="10" fill="#ede9fe"/><text x="1530" y="738" text-anchor="middle" class="chip" fill="#5b21b6">source：crop-trained Global epoch 100</text><text x="1530" y="759" text-anchor="middle" class="small" fill="#5b21b6">same model + Adam state</text><text x="1348" y="806" class="body">single GPU · deterministic</text><text x="1348" y="834" class="body">lr = 1e−4 · 20 epochs</text><text x="1348" y="862" class="body">batch size = 16</text><rect x="1348" y="898" width="364" height="54" rx="10" fill="#d1fae5"/><text x="1530" y="931" text-anchor="middle" class="chip" fill="#166534">PSNR / Worst PSNR / BER</text><text x="1348" y="986" class="small">目的：隔离 hard tail weighting 的影响</text><text x="1348" y="1014" class="small">不是重新定义前向网络</text></g>
  <path d="M206 508V626" class="loss"/><path d="M525 508V626" class="loss"/><path d="M856 846H878" class="loss"/><path d="M1290 846H1312" class="loss"/><path d="M1100 1050C1000 1120 360 1120 210 1055" class="loop"/>
  <g class="zh"><text x="900" y="1158" text-anchor="middle" class="small" fill="#64748b">蓝色实线：前向数据流｜橙色虚线：训练期 loss 旁路｜绿色虚线：反向更新 Encoder / Decoder</text></g>
</svg>
