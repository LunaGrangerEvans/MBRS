name: hidden-compat
channels:
  - conda-forge
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - --index-url https://pypi.org/simple
      - lpips==0.1.4
      - pytorch-msssim==1.0.0
      - scikit-image==0.24.0

# The runtime was created as an isolated prefix from the existing CUDA-capable
# Python 3.10 environment, retaining its tested torch stack:
# torch==2.4.1+cu121, torchvision==0.19.1+cu121.
# The MBRS environment is not used by the HiDDeN adapter.
